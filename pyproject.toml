[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidaydreamer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
smoke = ["mujoco>=3.2,<4"]
video = ["imageio[ffmpeg]>=2.30"]

[tool.setuptools]
packages = ["minidaydreamer"]
